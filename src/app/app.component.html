<div class="main-container">
  <mat-toolbar color="primary" class="top-toolbar" *ngIf="usuario">
    <button mat-icon-button (click)="toggleSidenav()">
      <mat-icon>menu</mat-icon>
    </button>
    <span>Sistema de Ventas</span>
    <span class="spacer"></span>
    <button mat-button (click)="logout()">
      <mat-icon>logout</mat-icon> Salir
    </button>
  </mat-toolbar>

  <mat-drawer-container class="drawer-container" >

    <mat-drawer #drawer mode="side" opened="true" class="sidenav" *ngIf="usuario">
      <mat-nav-list>

        <a mat-list-item [routerLink]="['/home']" routerLinkActive="active-link" [routerLinkActiveOptions]="{exact: true}">
          <div class="nav-item-wrapper">
            <mat-icon>home</mat-icon>
            <span class="nav-text">Inicio</span>
          </div>
        </a>

        <a mat-list-item [routerLink]="['/cliente']" routerLinkActive="active-link">
          <div class="nav-item-wrapper">
            <mat-icon>person</mat-icon>
            <span class="nav-text">Clientes</span>
          </div>
        </a>

        <a mat-list-item [routerLink]="['/venta']" routerLinkActive="active-link">
          <div class="nav-item-wrapper">
            <mat-icon>shopping_cart</mat-icon>
            <span class="nav-text">Venta</span>
          </div>
        </a>

      </mat-nav-list>
    </mat-drawer>

    <mat-drawer-content class="content">
      <div class="inner-content">
        <router-outlet></router-outlet>
      </div>
    </mat-drawer-content>
  </mat-drawer-container>
</div>
