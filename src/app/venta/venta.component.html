<div>
  <button mat-raised-button color="primary" (click)="openAdd()">Nuevo</button>
</div>
<div>
  <table mat-table style="width: 100%"[dataSource]="lst" class="mat-elevation-z4">
    <ng-container matColumnDef="producto">
      <th mat-header-cell *matHeaderCellDef >Producto</th>
      <td mat-cell *matCellDef="let element" > {{element.producto}}</td>
    </ng-container>

    <ng-container matColumnDef="cantidad">
      <th mat-header-cell *matHeaderCellDef >cantidad</th>
      <td mat-cell *matCellDef="let element" > {{element.cantidad}}</td>
    </ng-container>


    <ng-container matColumnDef="importe">
      <th mat-header-cell *matHeaderCellDef >importe</th>
      <td mat-cell *matCellDef="let element" > {{element.importe}}</td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="columnas"></tr>
    <tr mat-row *matRowDef="let row; columns: columnas"></tr>
  </table>
</div>
